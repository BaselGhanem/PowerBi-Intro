<script>
const C=[
["Grain / Granularity","مستوى التفاصيل","core","شو بيمثل الصف الواحد بالضبط؟","قبل أي تحليل اسأل: الصف الواحد شو قصته؟"],
["Fact Table","جدول العمليات","model","جدول الأحداث والأرقام اللي بدك تقيسها.","Fact = شو صار؟"],
["Dimension Table","جدول الوصف","model","جداول بتوصف مين، شو، وين ومتى.","Dimension = صفات الشي اللي صار."],
["Star Schema","النموذج النجمي","model","Fact بالنص وحوله Dimensions.","خلي الـ Fact بالنص والباقي حواليه."],
["Primary Key / Foreign Key","المفتاح الأساسي والخارجي","model","مفاتيح تربط السجلات بدون تخمين.","PK يعرّف، FK يربط."],
["Cardinality","نوع العلاقة","model","One-to-Many ولا Many-to-Many؟","كم سجل من هون يقابل كم سجل من هناك؟"],
["Filter Direction","اتجاه الفلترة","model","مين بفلتر مين داخل العلاقات.","غالباً Dimension → Fact."],
["Filter Context","سياق الفلترة","dax","الفلاتر الحالية وقت حساب الـ Measure.","نفس Measure، نتيجة مختلفة حسب الفلتر."],
["Row Context","سياق الصف","dax","الحساب يتعامل مع الصف الحالي.","أنا واقف على صف، شو قيمه؟"],
["Context Transition","تحويل السياق","dax","تحويل Row Context إلى Filter Context.","CALCULATE يغيّر طريقة رؤية السياق."],
["Measure","مقياس","dax","حساب ديناميكي يتغير حسب الفلاتر.","Measure يتجاوب مع التقرير."],
["Calculated Column","عمود محسوب","dax","قيمة تحسب لكل صف وتخزن بالموديل.","Column = نتيجة لكل صف."],
["Calculated Table","جدول محسوب","dax","جدول جديد يتولد باستخدام DAX.","DAX ممكن يبني جدول، مش بس رقم."],
["Aggregation","التجميع","core","جمع أو عد أو متوسط عدة صفوف.","حوّل صفوف كثيرة لرقم مفهوم."],
["Iterator","دوال X","dax","تمر على الصفوف واحد واحد ثم تجمع.","SUMX = احسب لكل صف ثم اجمع."],
["Distinct Count","العد الفريد","core","عد القيم المختلفة بدل الصفوف.","10 صفوف مش شرط 10 عملاء."],
["Additivity","قابلية الجمع","analysis","هل المقياس منطقي إذا جمعته؟","مش كل رقم ينفع تجمعه."],
["Time Intelligence","ذكاء الوقت","time","YTD وYoY وPrevious Month وغيرها.","التاريخ يجاوب: مقارنة بإمتى؟"],
["Date Dimension","جدول التاريخ","time","Calendar مستقل للتحليل الزمني.","التاريخ Dimension، مش مجرد عمود."],
["Snapshot","لقطة زمنية","time","حالة شيء في نقطة زمنية.","صورة للحالة، مش حركة."],
["Transaction Table","جدول الحركات","data","كل صف يمثل حدث فعلي.","بيع، طلب، دفعة، مرتجع = Transaction."],
["Slowly Changing Dimension","SCD","model","تتبع تغير صفات Dimension عبر الزمن.","احفظ التاريخ بدون ما تمسح القديم."],
["Surrogate Key","مفتاح بديل","model","ID داخلي ثابت للموديل.","ID تقني نظيف."],
["Business Key","مفتاح العمل","model","الكود المستخدم فعلياً بالشركة.","رقم العميل الحقيقي = Business Key."],
["Data Lineage","سلسلة مصدر البيانات","data","تعرف الرقم من وين إجا وكيف تحول.","كل رقم لازم ترجع لأصله."],
["Data Quality","جودة البيانات","data","Nulls وتكرار وأخطاء وقيم غريبة.","بيانات مضروبة = تحليل مضروب."],
["ETL","استخراج تحويل تحميل","data","Extract → Transform → Load.","جيب، نظف، حمّل."],
["Data Profiling","فحص البيانات","data","افحص التوزيع والـ Nulls والـ Errors.","افحص قبل ما تثق."],
["Normalization","التطبيع","model","فصل البيانات لتقليل التكرار.","خزن الحقيقة مرة واحدة."],
["Denormalization","إلغاء التطبيع","model","دمج بعض التفاصيل لتبسيط التحليل.","البساطة أحياناً أهم."],
["Bridge Table","جدول وسيط","model","وسيط يحل Many-to-Many.","Bridge يفك التشابك."],
["Role-Playing Dimension","Dimension متعدد الأدوار","model","نفس Dimension بأدوار مختلفة.","نفس التقويم، أكثر من دور."],
["Active / Inactive Relationship","علاقة نشطة وغير نشطة","model","أكثر من علاقة لكن واحدة Active.","Inactive تحتاج USERELATIONSHIP."],
["Referential Integrity","سلامة الربط","data","كل FK لازم يلاقي Key مقابل.","لا تترك Fact يتيم."],
["Semantic Model","النموذج الدلالي","model","طبقة أعمال من جداول وعلاقات وMeasures.","حوّل البيانات للغة البزنس."],
["KPI","مؤشر أداء رئيسي","analysis","Metric مربوط بهدف وTarget.","KPI = رقم + هدف + معنى."],
["Metric vs Dimension","مقياس مقابل بُعد","analysis","شو تقيس ومن أي زاوية.","Sales حسب Product."],
["Variance","الانحراف","analysis","الفرق بين Actual وTarget.","كم ابتعدنا عن الهدف؟"],
["Contribution / Mix","المساهمة","analysis","حصة عنصر من الإجمالي.","مين عامل أكبر قطعة من الكيكة؟"],
["YoY / MoM / QoQ","مقارنات دورية","time","سنة بسنة، شهر بشهر، ربع بربع.","قارن نفس الإطار بعدل."],
["Rolling Period","فترة متحركة","time","آخر 3 أو 12 شهر مثلاً.","كل نقطة معها آخر N فترات."],
["Cohort","مجموعة بداية مشتركة","analysis","مجموعة بدأت بنفس الفترة.","مين بدأ معنا بنفس الوقت؟"],
["Segmentation","التقسيم","analysis","تقسيم العملاء أو المنتجات لشرائح.","بدل آلاف الأسماء، شرائح مفهومة."],
["Outlier","قيمة شاذة","analysis","قيمة بعيدة عن النمط العام.","مين واقف بعيد عن الباقي؟"],
["Correlation vs Causation","ارتباط مقابل سببية","analysis","ارتباط رقمين لا يعني السببية.","يمشوا سوا ≠ واحد سبب الثاني."],
["Leading vs Lagging Indicator","مؤشر سابق ولاحق","analysis","Leading يلمح للمستقبل وLagging يصف النتيجة.","Visits تقود، Sales تصف ما حدث."]
];
const CM={core:["Core","#f2c811"],model:["Modeling","#099999"],dax:["DAX","#a88cff"],time:["Time","#66a6ff"],data:["Data","#ff9d5c"],analysis:["Analysis","#63d3a6"]};
const S=[
["صيدلية ودواء",["Invoice","Customer","Item","Qty","Sales"],[["INV-1041","Al Noor Pharmacy","CardioPlus","3","42.00"],["INV-1041","Al Noor Pharmacy","VitaMax","2","18.00"],["INV-1042","Life Pharmacy","CardioPlus","1","14.00"],["INV-1043","Al Shifa Pharmacy","Dermacare","4","52.00"]]],
["فروع ومبيعات",["Date","Branch","Rep","Orders","Net Sales"],[["2026-09-01","Amman West","Rami","18","1,940"],["2026-09-01","Zarqa","Lina","14","1,420"],["2026-09-02","Amman West","Rami","21","2,180"],["2026-09-02","Irbid","Omar","16","1,660"]]],
["HR",["Emp ID","Employee","Department","Grade","Salary"],[["E101","Dana","Finance","G7","1,250"],["E102","Sami","Sales","G6","980"],["E103","Maya","HR","G7","1,180"],["E104","Yazan","Sales","G5","840"]]],
["دورة تدريب",["Student","Cohort","Session","Attendance","Score"],[["Hisham","Sep-26","Day 1","Yes","82"],["Enas","Sep-26","Day 1","Yes","91"],["Somaya","Sep-26","Day 1","Yes","88"],["Hisham","Sep-26","Day 2","Yes","86"]]],
["مطعم",["Order","Table","Item","Qty","Amount"],[["R-501","T4","Burger","2","8.00"],["R-501","T4","Cola","2","2.50"],["R-502","T2","Pasta","1","6.50"],["R-503","T8","Coffee","3","4.50"]]]
];
function example(c,i){const b=JSON.parse(JSON.stringify(S[i]));const n=c[0];let note="راقب الجدول وحدد كيف يظهر مفهوم "+n+" في البيانات.";let hi=[0,1];
if(n.indexOf("Grain")===0)note="الـ Grain هنا هو: "+(i===0?"صنف داخل فاتورة":i===1?"فرع + مندوب + يوم":i===2?"موظف":i===3?"متدرب + جلسة":"صنف داخل طلب")+". تغيير المستوى يغيّر الحساب.";
else if(n==="Fact Table")note="هذه أحداث قابلة للقياس. الصفوف تقول ماذا حدث، والأعمدة الرقمية تعطيك المقاييس.";
else if(n==="Dimension Table")note="افصل Customer / Branch / Department في Dimension مستقل بدل تكراره بكل حركة.";

else if(n.indexOf("Primary Key")>=0)note="PK فريد في Dimension، وFK يتكرر داخل Fact لربط كل حركة بصاحبها.";
else if(n==="Cardinality")note="قيمة واحدة مثل "+b[2][0][1]+" قد تقابل عدة صفوف في Fact: One-to-Many.";

else if(n==="Filter Context")note="فلتر على "+b[2][0][1]+" فقط، ونفس Measure سيعطي نتيجة مختلفة.";
else if(n==="Row Context")note="Calculated Column ينظر للصف الحالي ويحسب بناء على قيمه.";
else if(n==="Context Transition")note="CALCULATE يمكنه تحويل سياق الصف الحالي إلى Filter Context.";
else if(n==="Measure")note="Total أو Average لا يخزن لكل صف؛ يحسب وقت العرض حسب الفلاتر.";
else if(n==="Calculated Column")note="مثال: High/Low أو Year. النتيجة تتولد لكل صف وتبقى مخزنة.";
else if(n==="Calculated Table")note="تقدر تولد Summary Table بـ DAX، مثل صف لكل "+b[1][1]+".";

else if(n==="Iterator")note="SUMX يمر صفاً صفاً، يحسب expression ثم يجمع النتائج.";

else if(n==="Additivity")note="Sales غالباً Additive، أما Average أو Stock Balance فلهما منطق مختلف.";
else if(n.indexOf("Time")>=0||n.indexOf("Date Dimension")>=0||n.indexOf("YoY")>=0||n.indexOf("Rolling")>=0||n==="Snapshot")note="التاريخ لازم يكون منظم عبر Date Table حتى المقارنات الزمنية تكون صحيحة.";

else if(n.indexOf("Slowly Changing")>=0)note="لو الصفة تغيرت، قرر هل تستبدل القديم أم تحفظ تاريخ التغيير.";
else if(n==="Surrogate Key")note="أضف ID داخلي ثابت حتى لو Business Code تغير.";
else if(n==="Business Key")note="Invoice No أو Employee ID مثال على كود يستخدمه البزنس فعلياً.";
else if(n==="Data Lineage")note="أي رقم لازم تقدر ترجعه من التقرير إلى Measure إلى Power Query إلى Source.";
else if(n==="Data Quality"){b[2][2][4]="";note="Null أو تكرار أو قيمة غير منطقية لازم ينكشف قبل التقرير.";hi=[2,4]}
else if(n==="ETL")note="Extract البيانات، Transform نظفها، ثم Load للموديل.";
else if(n==="Data Profiling")note="افحص Nulls وUnique Values وDistribution وErrors قبل البناء.";

else if(n.indexOf("Active / Inactive")>=0)note="علاقة التاريخ الأساسية Active، والثانية تستدعى عند الحاجة.";
else if(n==="Referential Integrity")note="كل FK في Fact لازم يجد Key مطابقاً في Dimension.";
else if(n==="Semantic Model")note="سمّي الجداول والـ Measures بلغة البزنس: Net Sales, Customer, Product.";
else if(n==="KPI")note="الرقم وحده ليس KPI؛ أضف Target واتجاه ومعنى.";
else if(n==="Metric vs Dimension")note=b[1][b[1].length-1]+" Metric، بينما "+b[1][1]+" Dimension: كم؟ حسب مين/وين؟";
else if(n==="Variance")note="Variance = Actual - Target أو Current - Previous.";
else if(n.indexOf("Contribution")>=0)note="احسب حصة كل عنصر من الإجمالي لتعرف مين حامل النتيجة.";
else if(n==="Cohort")note="اجمع الأشخاص حسب نقطة بداية مشتركة ثم تابع المجموعة مع الزمن.";
else if(n==="Segmentation")note="حوّل السجلات إلى High / Medium / Low بدل قراءة كل اسم.";
else if(n==="Outlier"){b[2][3][4]="9,999";note="9,999 بعيدة جداً عن النمط. تحقق: نجاح حقيقي أم خطأ؟";hi=[3,4]}
else if(n.indexOf("Correlation")>=0)note="تحرك رقمين معاً لا يثبت أن واحد سبب الثاني.";
else if(n.indexOf("Leading")>=0)note="Visits أو Attendance قد تكون Leading، وSales أو Score غالباً Lagging.";
return{name:b[0],cols:b[1],rows:b[2],note:note,hi:hi}}
const E=C.map(function(c,i){return{id:i+1,t:c[0],ar:c[1],cat:c[2],s:c[3],m:c[4],e:[0,1,2,3,4].map(function(x){return example(c,x)})}});
let active="all",sel=null,ei=0;const G=document.getElementById("grid"),Q=document.getElementById("q"),F=document.getElementById("fs"),D=document.getElementById("dlg");
document.getElementById("cc").textContent=E.length;document.getElementById("ec").textContent=(E.length*5)+" مثال بجدول";
[["all","الكل"],["core","Core"],["model","Modeling"],["dax","DAX"],["time","Time"],["data","Data"],["analysis","Analysis"]].forEach(function(v,i){const b=document.createElement("button");b.className="filter "+(i===0?"on":"");b.textContent=v[1];b.onclick=function(){active=v[0];Array.from(F.children).forEach(function(x){x.classList.toggle("on",x===b)});render()};F.appendChild(b)});
function mini(e){return [e.cols.slice(0,3)].concat(e.rows.slice(0,2).map(function(r){return r.slice(0,3)})).map(function(r,i){return '<div class="mr '+(i===0?"h":"")+'">'+r.map(function(v){return "<span>"+v+"</span>"}).join("")+"</div>"}).join("")}
function render(){const q=Q.value.toLowerCase().trim();const L=E.filter(function(c){return(active==="all"||c.cat===active)&&((c.t+" "+c.ar+" "+c.s).toLowerCase().indexOf(q)>=0)});G.innerHTML=L.map(function(c){const m=CM[c.cat];return '<article class="card" style="--a:'+m[1]+'" data-id="'+c.id+'"><div class="ct"><span class="pill">'+m[0]+'</span><span class="num">#'+String(c.id).padStart(2,"0")+'</span></div><h2>'+c.t+'</h2><div class="ar">'+c.ar+'</div><p class="sum">'+c.s+'</p><div class="mini">'+mini(c.e[0])+'</div><div class="cta"><span>5 أمثلة ببيانات فعلية</span><b>افتح الـ Card ←</b></div></article>'}).join("");Array.from(G.querySelectorAll(".card")).forEach(function(x){x.onclick=function(){openC(Number(x.dataset.id))}})}
function openC(id){sel=E.find(function(x){return x.id===id});ei=0;document.getElementById("cat").textContent=CM[sel.cat][0].toUpperCase();document.getElementById("title").textContent=sel.t;document.getElementById("desc").textContent=sel.ar+" — "+sel.s;document.getElementById("mem").textContent=sel.m;tabs();stage();D.showModal()}
function tabs(){document.getElementById("tabs").innerHTML=sel.e.map(function(e,i){return '<button class="tab '+(i===ei?"on":"")+'" data-i="'+i+'">مثال '+(i+1)+' · '+e.name+'</button>'}).join("");Array.from(document.querySelectorAll(".tab")).forEach(function(b){b.onclick=function(){ei=Number(b.dataset.i);tabs();stage()}})}
function stage(){const e=sel.e[ei];document.getElementById("stage").innerHTML='<div class="eh"><div><h3>'+e.name+'</h3><p>مثال '+(ei+1)+' من 5 — راقب الجدول ثم اقرأ الملاحظة.</p></div><span class="en">0'+(ei+1)+'</span></div><div class="tw"><table class="tbl"><thead><tr>'+e.cols.map(function(x){return "<th>"+x+"</th>"}).join("")+'</tr></thead><tbody>'+e.rows.map(function(r,ri){return "<tr>"+r.map(function(v,ci){return '<td class="'+(ri===e.hi[0]&&ci===e.hi[1]?"hi":"")+'">'+v+"</td>"}).join("")+"</tr>"}).join("")+'</tbody></table></div><div class="ins"><span>شو لازم تلاحظ؟</span><b>'+e.note+"</b></div>"}
Q.oninput=render;document.getElementById("x").onclick=function(){D.close()};D.onclick=function(e){if(e.target===D)D.close()};render();
</script></body></html>
