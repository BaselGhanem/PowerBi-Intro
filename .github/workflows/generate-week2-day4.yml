name: Generate Week 2 Day 4

on:
  push:
    paths:
      - 'tools/generate_week2_day4.py'
      - 'tools/generate_week1_data.py'
      - '.github/workflows/generate-week2-day4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install openpyxl reportlab
      - name: Generate Day 4 pack
        run: python tools/generate_week2_day4.py
      - name: Commit generated Day 4 pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week2/day4/downloads/Day04_MODEL_THE_BUSINESS.zip
          if git diff --cached --quiet; then
            echo "No Day 4 changes."
            exit 0
          fi
          git commit -m "Generate Day 4 model lab"
          git push
