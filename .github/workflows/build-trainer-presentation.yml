name: Build Trainer Presentation

on:
  push:
    paths:
      - 'Trainer/build_trainer_deck.js'
      - 'Trainer/landscape_src/**'
      - 'Trainer/assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PptxGenJS
        run: npm install --no-save pptxgenjs@3.12.0

      - name: Build landscape trainer deck
        run: |
          rm -f Trainer/Week1_Trainer_Playbook_Portrait.pptx
          node Trainer/build_trainer_deck.js

      - name: Commit generated presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Trainer/Week1_Trainer_Playbook_Portrait.pptx Trainer/Week1_Trainer_Playbook_Landscape_XAcademy.pptx
          if git diff --cached --quiet; then
            echo "No presentation changes."
            exit 0
          fi
          git commit -m "Build landscape Week 1 trainer presentation"
          git push
